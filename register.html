<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — Digital Pawnshop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand">
    <div class="brand" style="color:white"><div class="logo">DP</div><div>Digital Pawnshop</div></div>
    <div><div class="eyebrow" style="color:#8ed7d9">Customer registration</div><h1>Create your account and start an application.</h1><p>This page is for prototype presentation only.</p></div>
    <small style="color:#9fb8cf">Digital Pawnshop Management System</small>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <h2>Create account</h2><p>Enter basic customer details.</p>
      <div class="form-grid">
        <div class="field"><label>Full name</label><input value="Alif Haikal"></div>
        <div class="field"><label>Phone</label><input value="012-3456789"></div>
        <div class="field"><label>Email</label><input value="alif@example.com"></div>
        <div class="field"><label>Identification No.</label><input value="••••••-••-••••"></div>
      </div>
      <div class="field" style="margin-top:12px"><label>Password</label><input type="password" value="password"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="loginAs('customer')">Create Account</button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>

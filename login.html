<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Digital Pawnshop</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth-shell"><section class="auth-visual"><a class="brand" href="index.html"><img src="assets/logo.svg"><span>Digital Pawnshop</span></a><div class="auth-copy"><div class="eyebrow" style="color:#75d1cc">Presentation prototype</div><h1>One system, three distinct workflows.</h1><p>Use the demo role buttons to present the customer, valuation, and finance sides of the system.</p></div><small style="color:#9db5c8">No real payment, identity, or customer data is used.</small></section><section class="auth-panel"><div class="auth-card"><h2>Welcome back</h2><p class="muted">Choose a role to enter the prototype.</p><div class="field"><label>Email</label><input value="demo@digitalpawn.my"></div><div class="field" style="margin-top:12px"><label>Password</label><input type="password" value="password"></div><div class="demo-role-grid"><button class="btn btn-primary" onclick="demoLogin('customer')">Continue as Customer</button><button class="btn btn-secondary" onclick="demoLogin('pvo')">Pawn Valuation Officer</button><button class="btn btn-secondary" onclick="demoLogin('fro')">Finance & Risk Officer</button></div></div></section></div><script src="js/app.js"></script></body></html>
